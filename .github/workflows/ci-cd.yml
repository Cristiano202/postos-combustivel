name: Java CI/CD com Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postos_db
          POSTGRES_USER: cristiano
          POSTGRES_PASSWORD: senha_segura_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código fonte
        uses: actions/checkout@v4

      - name: Configurar o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Rodar Testes
        run: mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postos_db
          SPRING_DATASOURCE_USERNAME: cristiano
          SPRING_DATASOURCE_PASSWORD: senha_segura_ci

      # AUTOMÁTICO
      - name: Disparar Deploy no Render
        # TRAVA DE SEGURANÇA
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Accept: application/json"