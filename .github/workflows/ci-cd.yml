name: Java CI/CD com Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # CONFIGURAÇÃO DO BANCO POSTGRESQL NO DOCKER
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postos_db
          POSTGRES_USER: cristiano
          POSTGRES_PASSWORD: senha_segura_ci
        ports:
          - 5432:5432
        # Garante que o Postgres tente  conectar
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código fonte
        uses: actions/checkout@v4

      - name: Configurar o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      #  TESTES CONECTANDO NO BANCO DO CI
      - name: Compilar e Rodar Testes
        run: mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postos_db
          SPRING_DATASOURCE_USERNAME: cristiano
          SPRING_DATASOURCE_PASSWORD: senha_segura_ci